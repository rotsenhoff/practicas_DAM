<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenamiento 6 - Registro de usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="pagina">
        <section class="tarjeta" aria-labelledby="tituloRegistro">
            <p class="etiqueta">Entrenamiento 6</p>
            <h1 id="tituloRegistro">Crear una cuenta</h1>
            <p class="introduccion">Completa todos los campos. El botón de crear cuenta estará deshabilitado hasta que todos los campos estén correctamente rellenados.</p>

            <form id="formularioRegistro" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" autocomplete="name" required>
                    <p id="ayudaNombre" class="ayuda">Escribe al menos tres caracteres</p>
                    <p id="errorNombre" class="error" role="alert" hidden></p>

                </div>

                <div class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <p id="errorEmail" class="error" role="alert" hidden></p>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" required minlength="8">
                    <p id="errorContrasena" class="error" role="alert" hidden></p>
                </div>

                <div class="campo">
                    <label for="confirmarContrasena">Confirmar contraseña:</label>
                    <input type="password" id="confirmarContrasena" name="confirmarContrasena" autocomplete="new-password" required minlength="8">
                    <p id="errorConfirmarContrasena" class="error" role="alert" hidden></p>
                </div>

                <button type="submit" id="botonCrearCuenta" disabled>Crear cuenta</button>
            </form>
        </section>
    </main>
