<!--
Planteamiento del ejercicio
Crea una página web con un botón que cambie su color de fondo cuando el usuario
pase el ratón sobre él y que vuelva a su color original cuando el ratón se aleje.
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Entrenamiento 1 - Cambio de color</title>
</head>
<body>
    <main class="contenedor">
        <h1>Cambio de color mediante eventos</h1>
        <p>Pasa el puntero sobre el ratón y después retíralo</p>
        <button id="botonInteractivo" type="button">Pasa el puntero por aquí</button>
        <p id="estado" class="estado" aria-live="polite">Estado inicial</p>
    </main>
        <script src="script.js"></script>
</body>
</html>
