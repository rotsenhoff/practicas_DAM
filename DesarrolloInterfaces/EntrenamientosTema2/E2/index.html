<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>
        <h1>Datos de contacto</h1>
        <p>Completa ambos campos para continuar.</p>
        <form id="formulario">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" autocomplete="email" required>

            <label for="telefono">Teléfono(10cifras):</label>
            <input type="tel" id="telefono" name="telefono" inputmode="numeric" pattern="[0-9]{10}" title="Introduce un número de teléfono válido de 10 dígitos" 
            autocomplete="tel" required>

            <button type="submit">Enviar datos</button>

        </form>

        <p id="resultado" aria-live="polite"></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
