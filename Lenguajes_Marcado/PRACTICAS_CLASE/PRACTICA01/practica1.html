<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuarios</title>
    <link rel="stylesheet" href="practica1.css">
</head>
<body>
    <header>
        <h1>Registro de usuarios</h1>
        <p>Plataforma de acceso a los servicios digitales</p>
    </header>

    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Registro</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Formulario de registro</h2>

            <form>
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" minlength="6" required>

                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="18" max="100" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" required>

                <label for="pais">País</label>
                <select id="pais" name="pais" required>
                    <option value="">Seleccione un país</option>
                    <option value="es">España</option>
                    <option value="ar">Argentina</option>
                    <option value="co">Colombia</option>

                </select>

                <label class="checkbox">
                    <input type="checkbox" required>
                    Acepto los términos y condiciones
                </label>

                <div class="botones">
                
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p> 2025 Plataforma educativa</p>
    </footer>

</body>
</html>
